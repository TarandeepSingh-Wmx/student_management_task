<aside class="fixed left-0 top-20 bottom-0 w-64 bg-white border-r border-slate-200 p-5 overflow-y-auto">

    <div class="flex flex-col gap-5">

        <!-- Add Student -->
        <button routerLink="/students/add"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition">
            + Add Student
        </button>

        <!-- All Students -->
        <button routerLink="/students" routerLinkActive="bg-indigo-50 text-indigo-700 border-indigo-500"
            [routerLinkActiveOptions]="{ exact: true }"
            class="w-full border border-indigo-500 text-indigo-700 font-semibold py-3 rounded-lg hover:bg-indigo-50 transition">
            All Students
        </button>

        <!-- Student List -->
        <div class="mt-3">

            <!-- <h3 class="text-center font-bold text-slate-600 underline mb-4">
                STUDENTS
            </h3>

            <p class="text-center text-sm text-slate-400">
                Student names will appear here.
            </p> -->

        </div>

    </div>

</aside>
